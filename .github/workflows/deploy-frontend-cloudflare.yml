name: Deploy frontend to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'terms.html'
      - 'assets/**'
      - 'deploy/preview-worker.js'
      - 'deploy/wrangler.frontend.jsonc'
      - 'scripts/build-frontend-cloudflare.mjs'
      - '.github/workflows/deploy-frontend-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maps-hunter-pro-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend assets
        run: node scripts/build-frontend-cloudflare.mjs

      - name: Validate Worker syntax
        run: node --check deploy/preview-worker.js

      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is required for deployment."
            exit 1
          fi

      - name: Deploy frontend Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90d77a67b5686c9a9eec64a2d3749e0b
        run: npx --yes wrangler@4 deploy --config deploy/wrangler.frontend.jsonc
