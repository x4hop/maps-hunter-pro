name: Cleanup legacy branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in             fix/scan-stop-settings             fix/whatsapp-payment-link             handoff/8.4.0-rc10-maps-first             rebuild/8.4.0-extension             release/8.3.1-completion
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
