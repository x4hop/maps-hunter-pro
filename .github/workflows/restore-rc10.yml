name: Restore RC10 handoff

on:
  push:
    branches:
      - handoff/8.4.0-rc10-maps-first
    paths:
      - 'handoff/rc10-archive/**'
      - '.github/workflows/restore-rc10.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: handoff/8.4.0-rc10-maps-first
          fetch-depth: 0

      - name: Repair transferred chunks when needed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('handoff/rc10-archive')

          p = root / 'rc10.zip.b64.part02'
          s = p.read_text()
          if len(s) == 9987:
              s += '73jIcfzY7KihL'
              p.write_text(s)
          assert len(s) == 10000

          def ensure_char(name, index, wrong, right):
              p = root / name
              s = p.read_text()
              expected_len = 5744 if name.endswith('part21') else 10000
              assert len(s) == expected_len, (name, len(s))
              if s[index] == wrong:
                  s = s[:index] + right + s[index + 1:]
                  p.write_text(s)
              else:
                  assert s[index] == right, (name, index, s[index])

          ensure_char('rc10.zip.b64.part06', 4518, 'K', 'w')
          ensure_char('rc10.zip.b64.part13', 9250, 'o', 'e')
          ensure_char('rc10.zip.b64.part14', 1233, 'a', 'e')
          ensure_char('rc10.zip.b64.part21', 4759, 'I', 'A')

          p = root / 'rc10.zip.b64.part07'
          s = p.read_text()
          assert len(s) == 10000
          desired = 'ehRxMKONCuqkqOZhQxoV0lTYW8rZxM8YYe5zgYEIZF9JVNmhQcBXl+u/K+dxg/BeqdfkiaeL32iLL3HqbbJsJZTxR5LhzTEFenRwc6bXh5wryjscTSblU2gS95GDKhVTaQF6LMKFcSGWCNmFCuZBKG8jbQ2'
          assert len(desired) == 155
          if s[4019:4174] != desired:
              s = s[:4019] + desired + s[4174:]
              p.write_text(s)
          assert s[4019:4174] == desired
          PY

      - name: Rebuild and verify exact RC10 archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find handoff/rc10-archive -maxdepth 1 -name 'rc10.zip.b64.part*' | wc -l)" -eq 22
          for i in $(seq -w 0 21); do
            test -f "handoff/rc10-archive/rc10.zip.b64.part${i}"
          done
          cat handoff/rc10-archive/rc10.zip.b64.part* > /tmp/rc10.b64
          base64 -d /tmp/rc10.b64 > /tmp/rc10.zip
          echo 'fd73d74df1cb0ef073a47374ba4064733093bdf18a1218442c34b931c558eb21  /tmp/rc10.zip' | sha256sum -c -
          unzip -t /tmp/rc10.zip

      - name: Restore exact RC10 extension source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extension
          mkdir -p extension
          unzip -q /tmp/rc10.zip -d extension
          test "$(stat -c%s extension/background.js)" -eq 78179
          test "$(stat -c%s extension/content.js)" -eq 15315
          test "$(stat -c%s extension/data.js)" -eq 20363
          test "$(stat -c%s extension/manifest.json)" -eq 870
          test "$(stat -c%s extension/panel-v2.html)" -eq 7318
          test "$(stat -c%s extension/panel-v2.js)" -eq 14780
          test "$(stat -c%s extension/styles.css)" -eq 25296
          test "$(stat -c%s extension/xlsx-export.js)" -eq 17035

      - name: Commit restored RC10 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'maps-hunter-handoff-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add extension
          if git diff --cached --quiet; then
            echo 'RC10 source already matches.'
            exit 0
          fi
          git commit -m 'Restore verified RC10 extension source'
          git push origin HEAD:handoff/8.4.0-rc10-maps-first
