name: Restore extension icons
on:
  push:
    paths:
      - .github/workflows/restore-extension-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore reviewed PNG assets
        shell: bash
        run: |
          mkdir -p extension/icons
          printf '%s' '' | base64 -d > extension/icons/icon16.png
          printf '%s' '' | base64 -d > extension/icons/icon48.png
          printf '%s' '' | base64 -d > extension/icons/icon128.png
          file extension/icons/icon16.png extension/icons/icon48.png extension/icons/icon128.png
      - name: Commit icons when missing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/icons/icon16.png extension/icons/icon48.png extension/icons/icon128.png
          git diff --cached --quiet || git commit -m 'Add extension PNG icons'
          git push
