name: Release checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check assets/app.js
          node --check assets/i18n.js
          node --check assets/manual-i18n.js
          node --check assets/seo-i18n.js
          node --check admin/admin.js
          node --check backend/src/index.js
          node --check backend/src/entry.js
          node --check deploy/unified-worker.js
          node --check scripts/build-frontend-cloudflare.mjs
          node --check extension/background-wrapper.js
          node --check extension/background.js
          node --check extension/maps-page-overrides.js
          node --check extension/country-query-overrides.js
          node --check extension/location-phone-overrides.js
          node --check extension/contact-enrichment.js
          node --check extension/content.js
          node --check extension/data.js
          node --check extension/license-client.js
          node --check extension/panel-v2.js
          node --check extension/xlsx-export.js
      - name: Payment and licensing regression checks
        run: |
          node tests/test_payment_safety.mjs
          node tests/test_payment_api.mjs
          node tests/test_single_device_policy.mjs
          node tests/test_frontend_regressions.mjs
      - name: Current migration-chain check
        run: python3 tests/test_current_migration_chain.py
      - name: Extension manifest regression check
        run: python3 tests/test_manifest.py
      - name: Build Cloudflare production assets
        run: node scripts/build-frontend-cloudflare.mjs
      - name: Verify localized SEO and admin assets
        run: |
          test -f dist/frontend/en/index.html
          test -f dist/frontend/ar/index.html
          test -f dist/frontend/ru/index.html
          test -f dist/frontend/de/index.html
          test -f dist/frontend/es/index.html
          test -f dist/frontend/admin/index.html
          test -f dist/frontend/admin/admin.js
          test -f dist/frontend/assets/logo.svg
          test -f dist/frontend/assets/styles.css
          test -f dist/frontend/assets/manual.css
          test -f dist/frontend/assets/payment-icon-clean.css
          test -f dist/frontend/assets/ui-polish.css
          test -f dist/frontend/assets/layout-polish.css
          grep -q 'dir="rtl"' dist/frontend/ar/index.html
          grep -q 'name="google-site-verification" content="Rwt2LxDLsZnhc4H7unz17utjAmod8mHZ5AqVVtZCUoI"' dist/frontend/en/index.html
          grep -q 'data-mhp-critical-css' dist/frontend/en/index.html
          grep -q '"name": "maps-hunter-pro-api"' wrangler.jsonc
          grep -q 'deploy/unified-worker.js' wrangler.jsonc
      - name: Wrangler production dry run
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist/wrangler-dry-run --config wrangler.jsonc
      - name: Build static pages
        run: node scripts/build.mjs
      - name: XLSX regression check
        run: node tests/test_xlsx.mjs
      - name: Build extension release
        run: node scripts/release-extension.mjs
      - name: Resolve extension version
        id: ext
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Verify release version
        env:
          EXT_VERSION: ${{ steps.ext.outputs.version }}
        run: |
          test -f "release/maps-hunter-pro-extension-${EXT_VERSION}.zip"
          test -f "release/maps-hunter-pro-extension-${EXT_VERSION}.sha256"
          test -f "release/maps-hunter-pro-extension-${EXT_VERSION}-contents.txt"
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: maps-hunter-pro-extension-${{ steps.ext.outputs.version }}
          path: |
            release/maps-hunter-pro-extension-${{ steps.ext.outputs.version }}.zip
            release/maps-hunter-pro-extension-${{ steps.ext.outputs.version }}.sha256
            release/maps-hunter-pro-extension-${{ steps.ext.outputs.version }}-contents.txt
          if-no-files-found: error
