name: Deploy backend to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maps-hunter-pro-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate backend syntax
        run: |
          node --check backend/src/index.js
          node --check backend/src/entry.js

      - name: Require Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is required for deployment."
            exit 1
          fi

      - name: Deploy backend Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90d77a67b5686c9a9eec64a2d3749e0b
        run: npx --yes wrangler@4 deploy --config backend/wrangler.toml
